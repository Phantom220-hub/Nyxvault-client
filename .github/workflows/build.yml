name: Build NYXVAULT CLIENT

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f -iname '*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found"
            exit 1
          fi
          mkdir project
          unzip "$ZIP_FILE" -d project
          echo "Project extracted"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build project
        run: |
          GRADLE_FILE=$(find project -name gradlew -type f | head -n 1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: gradlew not found in ZIP"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: NYXVAULT-CLIENT-JAR
          path: project/**/build/libs/*.jar
          if-no-files-found: error
